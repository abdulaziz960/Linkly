substitutions:
  # Set via a Cloud Build trigger substitution - a public phone number,
  # not a secret, but still has to travel through as a build arg since
  # Next.js inlines NEXT_PUBLIC_* vars at build time (see Dockerfile).
  _SALES_WHATSAPP_NUMBER: ""
  # Moyasar's own public/publishable key (pk_test_.../pk_live_...) - safe by
  # design, but same build-arg mechanism as above since it's NEXT_PUBLIC_*.
  _MOYASAR_PUBLISHABLE_KEY: ""
  # Sentry DSN - not a secret (accepts events only), same build-arg mechanism.
  # Leave empty to keep error monitoring off. The server/edge Sentry init
  # (sentry.server.config.ts/sentry.edge.config.ts) reads a separate runtime
  # env var, SENTRY_DSN, set directly on the Cloud Run service - not here.
  _SENTRY_DSN: ""
  # Emergency switch for the quality gate below. Leave "false". Set the trigger
  # substitution _SKIP_CHECKS to "true" only to ship a fix while the checks
  # themselves are broken - the gate is what keeps a failing build off
  # production, so every skipped run should be followed by a normal one.
  _SKIP_CHECKS: "false"
  # The production database the migrate step tunnels to (docs/database-access.md).
  _CLOUD_SQL_INSTANCE: "linkly-prod:me-central2:linkly-pg"
  _CLOUD_SQL_PROXY_VERSION: "v2.14.1"

# The checks run next to the image build and the push waits for all of them, so a
# failing check stops the release without adding their time to the build.
# Headroom over Cloud Build's 10 minute default.
timeout: 1800s

steps:
  # Same lint / typecheck / unit-test gate as .github/workflows/ci.yml (the
  # slow browser journeys stay in GitHub Actions). Nothing is pushed or
  # deployed unless every one of these steps succeeds.
  - id: install
    name: "node:22"
    waitFor: ["-"]
    entrypoint: bash
    args: ["-ec", 'if [ "$_SKIP_CHECKS" = "true" ]; then echo "WARNING: quality gate skipped (_SKIP_CHECKS=true)"; else npm ci; fi']

  # One after the other: the 8 GB machine is also building the image and running four test shards.
  - id: lint-typecheck
    name: "node:22"
    waitFor: ["install"]
    entrypoint: bash
    args: ["-ec", '[ "$_SKIP_CHECKS" = "true" ] || { npm run lint && npm run typecheck; }']

  # The unit suite split by file into four containers that run at the same time; each shard still runs its own files
  # one by one. No --retry here: it makes vitest report the suite's intentional expected-failure tests (it.fails) as
  # failures. When changing the count, change every --shard and push-image's waitFor (tests/cloudbuild-gate.test.ts).
  - id: test-1
    name: "node:22"
    waitFor: ["install"]
    entrypoint: bash
    args: ["-ec", '[ "$_SKIP_CHECKS" = "true" ] || npm test -- --shard=1/4']

  - id: test-2
    name: "node:22"
    waitFor: ["install"]
    entrypoint: bash
    args: ["-ec", '[ "$_SKIP_CHECKS" = "true" ] || npm test -- --shard=2/4']

  - id: test-3
    name: "node:22"
    waitFor: ["install"]
    entrypoint: bash
    args: ["-ec", '[ "$_SKIP_CHECKS" = "true" ] || npm test -- --shard=3/4']

  - id: test-4
    name: "node:22"
    waitFor: ["install"]
    entrypoint: bash
    args: ["-ec", '[ "$_SKIP_CHECKS" = "true" ] || npm test -- --shard=4/4']

  # The dependency layer (npm ci) only changes when package-lock.json does, so it is built as its own image and kept in the
  # registry; the next build starts from it instead of reinstalling everything. A missing or stale cache only costs time
  # (every cache step tolerates failure), never correctness.
  - id: build-image
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["-"]
    entrypoint: bash
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        set -uo pipefail
        REPO="me-central2-docker.pkg.dev/$PROJECT_ID/linkly"
        docker pull "$$REPO/deps-cache:latest" || echo "no dependency cache yet"
        docker build --target deps --cache-from "$$REPO/deps-cache:latest" --build-arg BUILDKIT_INLINE_CACHE=1 -t "$$REPO/deps-cache:latest" . || echo "dependency cache build skipped"
        docker build --cache-from "$$REPO/deps-cache:latest"           --build-arg "NEXT_PUBLIC_SALES_WHATSAPP_NUMBER=$_SALES_WHATSAPP_NUMBER"           --build-arg "NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY=$_MOYASAR_PUBLISHABLE_KEY"           --build-arg "NEXT_PUBLIC_SENTRY_DSN=$_SENTRY_DSN"           -t "$$REPO/app:$BUILD_ID" . || exit 1
        docker push "$$REPO/deps-cache:latest" || echo "dependency cache not pushed"

  - id: push-image
    name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-image", "lint-typecheck", "test-1", "test-2", "test-3", "test-4"]
    args:
      - "push"
      - "me-central2-docker.pkg.dev/$PROJECT_ID/linkly/app:$BUILD_ID"

  # Applies pending Prisma migrations before the new code goes live, through the same
  # Cloud SQL socket path (/cloudsql/...) the Cloud Run service uses, so the DATABASE_URL
  # secret works unchanged. prisma-migrate-deploy.mjs refuses an unsafe database state and
  # exits non-zero, which stops the release. The previous revision keeps serving on the new
  # schema until the promote step, so migrations must stay additive (add now, drop later).
  # Needs the Cloud Build service account to have roles/cloudsql.client and
  # roles/secretmanager.secretAccessor on the DATABASE_URL secret.
  - id: migrate
    name: "node:22"
    waitFor: ["push-image"]
    entrypoint: bash
    secretEnv: ["PROD_DATABASE_URL"]
    args:
      - "-c"
      - |
        set -euo pipefail
        [ -d node_modules ] || npm ci --ignore-scripts
        curl -fsSL -o /tmp/cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$_CLOUD_SQL_PROXY_VERSION/cloud-sql-proxy.linux.amd64"
        chmod +x /tmp/cloud-sql-proxy
        mkdir -p /cloudsql
        /tmp/cloud-sql-proxy --unix-socket /cloudsql "$_CLOUD_SQL_INSTANCE" &
        for attempt in $(seq 1 30); do [ -S "/cloudsql/$_CLOUD_SQL_INSTANCE/.s.PGSQL.5432" ] && break; sleep 1; done
        DATABASE_URL="$$PROD_DATABASE_URL" node scripts/prisma-migrate-deploy.mjs

  # The new revision starts with no traffic, behind its own "candidate" URL.
  - id: deploy
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    waitFor: ["migrate"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "linkly"
      - "--image=me-central2-docker.pkg.dev/$PROJECT_ID/linkly/app:$BUILD_ID"
      - "--region=me-central2"
      - "--revision-suffix=$BUILD_ID"
      - "--no-traffic"
      - "--tag=candidate"
      - "--quiet"

  # Live traffic moves to the new revision only once its /api/health answers 200 (the app
  # is up and reaches the database). Otherwise users stay on the previous revision.
  # Manual rollback: gcloud run services update-traffic linkly --region=me-central2 --to-revisions=<previous revision>=100
  - id: promote
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    waitFor: ["deploy"]
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        SERVICE_URL="$(gcloud run services describe linkly --region=me-central2 --format='value(status.url)')"
        CANDIDATE_URL="$(echo "$$SERVICE_URL" | sed 's#^https://#https://candidate---#')"
        for attempt in 1 2 3 4 5 6; do
          if curl -fsS --max-time 15 "$$CANDIDATE_URL/api/health"; then
            gcloud run services update-traffic linkly --region=me-central2 --to-revisions="linkly-$BUILD_ID=100" --quiet
            exit 0
          fi
          sleep 10
        done
        echo "linkly-$BUILD_ID failed its health check at $$CANDIDATE_URL - live traffic left on the previous revision." >&2
        exit 1

images:
  - "me-central2-docker.pkg.dev/$PROJECT_ID/linkly/app:$BUILD_ID"

availableSecrets:
  secretManager:
    # Not named DATABASE_URL: options.env below already sets that to the CI SQLite file.
    - versionName: "projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest"
      env: "PROD_DATABASE_URL"

options:
  logging: CLOUD_LOGGING_ONLY
  # What the checks need (CI values, not secrets). The image build and the deploy do not read them.
  env:
    - "DATABASE_URL=file:./ci.db"
    - "AUTH_SECRET=ci-only-auth-secret-with-at-least-32-characters"
    - "NEXT_TELEMETRY_DISABLED=1"
  # The gate (npm ci, lint, typecheck, the unit suite) and the image build run side by side. On the default
  # 1-2 vCPU machine they fought over the CPU and a release took ~20 minutes; 8 vCPUs run them in parallel.
  machineType: E2_HIGHCPU_8
